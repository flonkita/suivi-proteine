version: '3.8'

services:
  postgres-db:
    image: postgres:15
    container_name: suivi-proteine-db
    restart: always
    environment:
      POSTGRES_USER: floallen
      POSTGRES_PASSWORD: scorps
      POSTGRES_DB: suiviproteine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: